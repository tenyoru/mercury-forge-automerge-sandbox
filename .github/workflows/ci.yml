name: ci
on:
  push:
  pull_request:
jobs:
  pass:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
  fail-on-request:
    runs-on: ubuntu-latest
    env:
      REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Fail when the branch starts with fail/
        run: |
          case "$REF" in fail/*) echo "requested failure"; exit 1;; esac
          echo ok
